services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sera-postgres
    environment:
      POSTGRES_USER: sera
      POSTGRES_PASSWORD: sera
      POSTGRES_DB: sera
    ports:
      - "5432:5432"
    volumes:
      - sera_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sera -d sera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sera-redis
    ports:
      - "6379:6379"
    volumes:
      - sera_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sera_pg:
  sera_redis:
